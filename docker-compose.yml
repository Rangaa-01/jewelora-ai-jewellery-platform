# Development / single-host deployment stack.
#   docker compose up --build
# Visit http://localhost:8080 (nginx). Copy .env.example to .env first.

name: jewelora

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jewelora}
      POSTGRES_USER: ${POSTGRES_USER:-jewelora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  migrate:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jewelora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jewelora}
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jewelora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jewelora}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      FRONTEND_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      STORAGE_LOCAL_ROOT: /data/storage
      TRUSTED_HOSTS: "*"
    volumes:
      - storage-data:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Optional S3-compatible object storage for local testing of STORAGE_BACKEND=s3:
  #   docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  storage-data:
  minio-data:
