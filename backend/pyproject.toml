[project]
name = "jewelora-backend"
version = "0.1.0"
description = "Jewelora API: FastAPI backend for the AI jewellery try-on and commerce platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "structlog>=24.4",
  "httpx>=0.27",
  "pillow>=10.4",
  "numpy>=2.0",
  "aiofiles>=24.1",
  "boto3>=1.35",
  "anthropic>=0.40",
  "rembg>=2.0.60",
  "onnxruntime>=1.18",
  "jewelora-ai",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-aiofiles",
  "faker>=28",
  "trimesh>=4.4",
  "pygltflib>=1.16",
]

[tool.uv.sources]
jewelora-ai = { path = "../ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
