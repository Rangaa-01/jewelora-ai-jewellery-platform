# Single-origin reverse proxy: the browser talks only to nginx.
#   /api/*       -> backend (FastAPI)
#   everything   -> frontend (Next.js)
# TLS is terminated here in production; mount certificates and enable the 443 block.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_max_body_size 64m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

  upstream frontend { server frontend:3000; }
  upstream backend  { server backend:8000; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /models/ {
      proxy_pass http://frontend;
      add_header Cache-Control "public, max-age=604800";
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
