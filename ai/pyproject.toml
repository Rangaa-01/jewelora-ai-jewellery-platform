[project]
name = "jewelora-ai"
version = "0.1.0"
description = "Jewelora AI try-on engine: landmark detection, jewellery fitting and compositing"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.4",
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jewelora_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
